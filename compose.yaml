name: chat-to-video

services:
  mysql:
    image: mysql:8.4
    command:
      - "--port=${MYSQL_PORT:-4002}"
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE:-chat_to_video}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-chat_to_video}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-change-me}"
      MYSQL_TCP_PORT: "${MYSQL_PORT:-4002}"
      MYSQL_USER: "${MYSQL_USER:-chat_to_video}"
    ports:
      - "${MYSQL_PORT:-4002}:${MYSQL_PORT:-4002}"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -P "$${MYSQL_TCP_PORT}" -u"$${MYSQL_USER}" --password="$${MYSQL_PASSWORD}" --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --port
      - "${REDIS_PORT:-4003}"
      - --appendonly
      - "yes"
    environment:
      REDIS_PORT: "${REDIS_PORT:-4003}"
    ports:
      - "${REDIS_PORT:-4003}:${REDIS_PORT:-4003}"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -p "$${REDIS_PORT}" ping
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: api-runtime
    environment:
      API_PORT: "${API_PORT:-4001}"
      APIMART_API_KEY: "${APIMART_API_KEY:-}"
      APIMART_BASE_URL: "${APIMART_BASE_URL:-https://api.apimart.ai/v1}"
      APIMART_CHAT_MODEL: "${APIMART_CHAT_MODEL:-gpt-5-mini}"
      APIMART_TIMEOUT_MS: "${APIMART_TIMEOUT_MS:-30000}"
      DATABASE_URL: "mysql://${MYSQL_USER:-chat_to_video}:${MYSQL_PASSWORD:-chat_to_video}@mysql:${MYSQL_PORT:-4002}/${MYSQL_DATABASE:-chat_to_video}"
      NODE_ENV: production
      REDIS_URL: "redis://redis:${REDIS_PORT:-4003}"
    init: true
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${API_PORT:-4001}:${API_PORT:-4001}"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:${API_PORT:-4001}/health').then(response=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: web-runtime
    environment:
      API_BASE_URL: "http://api:${API_PORT:-4001}"
      NODE_ENV: production
      PORT: "${WEB_PORT:-4000}"
      WEB_PORT: "${WEB_PORT:-4000}"
    init: true
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-4000}:${WEB_PORT:-4000}"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:${WEB_PORT:-4000}').then(response=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
