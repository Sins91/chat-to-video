name: chat-to-video

services:
  mysql:
    image: mysql:8.4
    command:
      - "--port=${MYSQL_PORT:-4002}"
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE:-chat_to_video}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-chat_to_video}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-change-me}"
      MYSQL_TCP_PORT: "${MYSQL_PORT:-4002}"
      MYSQL_USER: "${MYSQL_USER:-chat_to_video}"
    ports:
      - "${MYSQL_PORT:-4002}:${MYSQL_PORT:-4002}"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -P "$${MYSQL_TCP_PORT}" -u"$${MYSQL_USER}" --password="$${MYSQL_PASSWORD}" --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  database-migrate:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: database-migrate
    environment:
      DATABASE_URL: "mysql://${MYSQL_USER:-chat_to_video}:${MYSQL_PASSWORD:-chat_to_video}@mysql:${MYSQL_PORT:-4002}/${MYSQL_DATABASE:-chat_to_video}"
      NODE_ENV: production
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  redis:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --port
      - "${REDIS_PORT:-4003}"
      - --appendonly
      - "yes"
    environment:
      REDIS_PORT: "${REDIS_PORT:-4003}"
    ports:
      - "${REDIS_PORT:-4003}:${REDIS_PORT:-4003}"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -p "$${REDIS_PORT}" ping
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-07-18T21-56-31Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${S3_ACCESS_KEY:-change-me}"
      MINIO_ROOT_PASSWORD: "${S3_SECRET_KEY:-change-me}"
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${S3_ACCESS_KEY}" "$${S3_SECRET_KEY}" &&
        mc mb --ignore-existing "local/$${S3_BUCKET}"
    environment:
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:-change-me}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:-change-me}"
      S3_BUCKET: "${S3_BUCKET:-chat-to-video}"

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: api-runtime
    environment:
      API_PORT: "${API_PORT:-4101}"
      APIMART_API_KEY: "${APIMART_API_KEY:-}"
      APIMART_BASE_URL: "${APIMART_BASE_URL:-https://api.apimart.ai/v1}"
      APIMART_CHAT_MODEL: "${APIMART_CHAT_MODEL:-gpt-5-mini}"
      APIMART_TIMEOUT_MS: "${APIMART_TIMEOUT_MS:-30000}"
      APIMART_STORYBOARD_TIMEOUT_MS: "${APIMART_STORYBOARD_TIMEOUT_MS:-120000}"
      DATABASE_URL: "mysql://${MYSQL_USER:-chat_to_video}:${MYSQL_PASSWORD:-chat_to_video}@mysql:${MYSQL_PORT:-4002}/${MYSQL_DATABASE:-chat_to_video}"
      NODE_ENV: production
      REDIS_URL: "redis://redis:${REDIS_PORT:-4003}"
      S3_ENDPOINT: "http://localhost:${S3_PORT:-9000}"
      S3_REGION: "${S3_REGION:-us-east-1}"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:-change-me}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:-change-me}"
      S3_BUCKET: "${S3_BUCKET:-chat-to-video}"
      S3_FORCE_PATH_STYLE: "true"
    init: true
    depends_on:
      database-migrate:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "${API_PORT:-4101}:${API_PORT:-4101}"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:${API_PORT:-4101}/health').then(response=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: worker-runtime
    environment:
      APIMART_API_KEY: "${APIMART_API_KEY:-}"
      APIMART_BASE_URL: "${APIMART_BASE_URL:-https://api.apimart.ai/v1}"
      APIMART_VIDEO_MODEL: "${APIMART_VIDEO_MODEL:-doubao-seedance-2.0}"
      APIMART_VIDEO_DURATION_SECONDS: "${APIMART_VIDEO_DURATION_SECONDS:-10}"
      APIMART_VIDEO_GENERATE_AUDIO: "${APIMART_VIDEO_GENERATE_AUDIO:-true}"
      APIMART_VIDEO_POLL_INTERVAL_MS: "${APIMART_VIDEO_POLL_INTERVAL_MS:-5000}"
      APIMART_VIDEO_RESULT_HOSTS: "${APIMART_VIDEO_RESULT_HOSTS:-apimart.ai,getapib.org}"
      APIMART_VIDEO_TASK_TIMEOUT_MS: "${APIMART_VIDEO_TASK_TIMEOUT_MS:-900000}"
      DATABASE_URL: "mysql://${MYSQL_USER:-chat_to_video}:${MYSQL_PASSWORD:-chat_to_video}@mysql:${MYSQL_PORT:-4002}/${MYSQL_DATABASE:-chat_to_video}"
      NODE_ENV: production
      REDIS_URL: "redis://redis:${REDIS_PORT:-4003}"
      S3_ENDPOINT: "http://minio:9000"
      S3_REGION: "${S3_REGION:-us-east-1}"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:-change-me}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:-change-me}"
      S3_BUCKET: "${S3_BUCKET:-chat-to-video}"
      S3_FORCE_PATH_STYLE: "true"
    init: true
    depends_on:
      database-migrate:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: web-runtime
    environment:
      API_BASE_URL: "http://api:${API_PORT:-4101}"
      NODE_ENV: production
      PORT: "${WEB_PORT:-4000}"
      WEB_PORT: "${WEB_PORT:-4000}"
    init: true
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-4000}:${WEB_PORT:-4000}"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:${WEB_PORT:-4000}').then(response=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  minio_data:
